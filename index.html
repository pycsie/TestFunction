<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM 快速打卡系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 14px; }
        label { font-size: 0.85rem; font-weight: bold; color: #334155; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-top: 4px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-verify { background: #0284c7; color: white; }
        .btn-clock { background: #16a34a; color: white; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; }
        .success { display: block; background: #dcfce7; color: #15803d; }
        .error { display: block; background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="card">
    <h2>HCM 打卡系統</h2>
    <div class="form-group">
        <label>工號 / 帳號</label>
        <input type="text" id="empId" value="">
    </div>
    <div class="form-group">
        <label>密碼</label>
        <input type="password" id="empPass" value="">
    </div>

    <!-- 階段 1：驗證按鈕 -->
    <button id="verifyBtn" class="btn btn-verify" onclick="handleVerify()">1. 驗證帳密</button>
    
    <!-- 階段 2：打卡按鈕（預設停用） -->
    <button id="clockBtn" class="btn btn-clock" onclick="handleClock()" disabled>2. 執行真實打卡</button>

    <div id="statusBox" class="status"></div>

    <div style="margin-top: 15px;">
        <label style="font-size: 0.75rem;">Cloudflare Worker API 網址：</label>
        <input type="text" id="workerUrl" value="https://tight-tooth-aa3e.qwe90723.workers.dev" style="font-size: 0.75rem;">
    </div>
</div>

<script>
    async function handleVerify() {
        const workerUrl = document.getElementById('workerUrl').value.trim();
        const empId = document.getElementById('empId').value.trim();
        const empPass = document.getElementById('empPass').value.trim();

        showStatus('正在向 HCM 驗證帳密...', true);

        try {
            const res = await fetch(workerUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'verify', emp_id: empId, pass: empPass })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showStatus('✅ 帳號密碼驗證成功！請點擊下方「2. 執行真實打卡」。', true);
                document.getElementById('clockBtn').disabled = false; // 啟用打卡按鈕
            } else {
                showStatus('❌ ' + (data.message || '帳密驗證失敗'), false);
                document.getElementById('clockBtn').disabled = true;
            }
        } catch (e) {
            showStatus('❌ 連線異常：' + e.message, false);
        }
    }

    async function handleClock() {
        const workerUrl = document.getElementById('workerUrl').value.trim();
        const empId = document.getElementById('empId').value.trim();
        const empPass = document.getElementById('empPass').value.trim();

        showStatus('發送打卡請求中...', true);

        try {
            const res = await fetch(workerUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'clock', emp_id: empId, pass: empPass })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showStatus('✅ 打卡請求已順利完成！', true);
            } else {
                showStatus('❌ 打卡失敗：' + data.message, false);
            }
        } catch (e) {
            showStatus('❌ 連線異常：' + e.message, false);
        }
    }

    function showStatus(msg, isSuccess) {
        const box = document.getElementById('statusBox');
        box.innerText = msg;
        box.className = `status ${isSuccess ? 'success' : 'error'}`;
    }
</script>

</body>
</html>
